name: Feature request
description: Suggest something new or a change to how Inboxi works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Inboxi keeps mail, passwords, and keys on the user's computer, and sends no telemetry. Ideas that break those promises will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like Inboxi to handle it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this once the approach is agreed.
